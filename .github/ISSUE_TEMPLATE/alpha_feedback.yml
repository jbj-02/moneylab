name: MoneyLab alpha feedback
description: Report confusing inputs, missing costs, calculation issues, or suggestions without sharing personal financial details.
title: "[Alpha feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing MoneyLab. **This is a public GitHub issue.**
        Please do not include actual income, balances, account numbers,
        transactions, passwords, names, addresses, or other personal information.
        Use fictional numbers to reproduce any calculation issue.
  - type: dropdown
    id: topic
    attributes:
      label: What kind of feedback is this?
      options:
        - Confusing input or wording
        - Unexpected or incorrect calculation
        - Missing expense or assumption
        - Mobile layout or accessibility
        - Feature or decision I'd like to explore
        - General usability problem
    validations:
      required: true
  - type: dropdown
    id: experience
    attributes:
      label: Which part of MoneyLab?
      options:
        - Home
        - Moving Out Decision Lab
        - Other Decisions
        - Quick Start / Smart Paste
        - My Money / Goals
        - Learn / Settings
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Please describe the experience, without private financial figures.
      placeholder: I expected the upfront costs to be separated from monthly costs.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Use fictional values only if you need to describe a calculation.
      placeholder: The screen was difficult to use on my phone.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included private or identifying financial details.
          required: true
