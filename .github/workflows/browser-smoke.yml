name: Browser UI smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium --with-deps
      - name: Launch local Streamlit app
        run: |
          nohup python -m streamlit run app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 > streamlit.log 2>&1 &
          MONEYLAB_LOCAL_STORE="$RUNNER_TEMP/moneylab-local" \
            nohup python -m streamlit run app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8502 > streamlit-local.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null && \
               curl -fsS http://127.0.0.1:8502/_stcore/health >/dev/null; then
              echo "Streamlit ready"
              exit 0
            fi
            sleep 2
          done
          cat streamlit.log
          exit 1
      - name: Launch the pre-change app for comparison screenshots
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach "$RUNNER_TEMP/moneylab-before" 533dbe46754717c2774b24558d9905af86631f86
          cd "$RUNNER_TEMP/moneylab-before"
          nohup python -m streamlit run app.py --server.headless=true \
            --server.address=127.0.0.1 --server.port=8503 > "$GITHUB_WORKSPACE/streamlit-before.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8503/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$GITHUB_WORKSPACE/streamlit-before.log"
          exit 1
      - name: Run desktop and mobile Chromium journeys
        env:
          MONEYLAB_BASELINE_TEST_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8503' || '' }}
          MONEYLAB_PERSISTENCE_TEST_URL: http://127.0.0.1:8502
        run: python tests/browser_smoke.py
      - name: Upload fictional browser screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneylab-browser-smoke
          path: |
            artifacts/browser/
            streamlit.log
            streamlit-local.log
            streamlit-before.log
          retention-days: 7
