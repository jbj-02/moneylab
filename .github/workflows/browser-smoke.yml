name: Browser UI smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium --with-deps
      - name: Launch local Streamlit app
        run: |
          nohup python -m streamlit run app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 > streamlit.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit ready"
              exit 0
            fi
            sleep 2
          done
          cat streamlit.log
          exit 1
      - name: Run desktop and mobile Chromium journeys
        run: python tests/browser_smoke.py
      - name: Upload fictional browser screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneylab-browser-smoke
          path: |
            artifacts/browser/
            streamlit.log
          retention-days: 7
